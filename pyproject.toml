# Tool configuration only (the project is not an installable package).

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "data", "checkpoints", "predictions", "wandb", "results"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
# B905: zip(strict=...) on short, same-length sequences adds noise
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests add PROJECT_ROOT to sys.path before importing src
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
